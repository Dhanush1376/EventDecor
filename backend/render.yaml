# Render Blueprint — no seed/deploy hooks (never run seedData.ts in production)
services:
  - type: web
    name: siri-arts-backend
    runtime: docker
    # Production minimum: standard (2 GB RAM). starter (512 MB) OOMs under Mongo pool + Redis + Socket.io.
    plan: standard
    autoDeploy: true
    healthCheckPath: /api/readiness
    maxShutdownDelaySeconds: 10
    envVars:
      - key: NODE_ENV
        value: production
      # Client IP for rate limits / audit logs. Render-only: 1. Cloudflare → Render: 2 (see docs/DEPLOYMENT.md).
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PORT
        value: 10000
      - key: MONGO_URI
        fromConfig: true
      # Per-instance pool cap — keep low when scaling horizontally (10 × N instances vs Atlas limit)
      - key: MONGO_POOL_SIZE
        value: "10"
      - key: ADMIN_ANALYTICS_CACHE_TTL
        value: "300"
      - key: JWT_SECRET
        fromConfig: true
      # Intentionally short — forces refresh-token rotation; do not use 7d in production
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: 30
      - key: ADMIN_PASSWORD
        fromConfig: true
      - key: ADMIN_EMAIL
        fromConfig: true
      - key: OTP_EXPIRY_MINUTES
        value: 5
      - key: RAZORPAY_KEY_ID
        fromConfig: true
      - key: RAZORPAY_KEY_SECRET
        fromConfig: true
      - key: RAZORPAY_WEBHOOK_SECRET
        fromConfig: true
      - key: SUPER_ADMIN_EMAIL
        fromConfig: true
      - key: CLOUDINARY_CLOUD_NAME
        fromConfig: true
      - key: CLOUDINARY_API_KEY
        fromConfig: true
      - key: CLOUDINARY_API_SECRET
        fromConfig: true
      - key: FRONTEND_URLS
        fromConfig: true
      - key: SENTRY_DSN
        fromConfig: true
      - key: SMTP_USER
        fromConfig: true
      - key: SMTP_PASS
        fromConfig: true
      - key: BREVO_API_KEY
        fromConfig: true
      - key: REDIS_URL
        fromConfig: true
      - key: REQUIRE_REDIS
        value: "true"
      - key: LOG_LEVEL
        value: warn
      - key: SMTP_FROM_EMAIL
        fromConfig: true
      - key: SMTP_FROM_NAME
        value: "Siri Arts Studio"
      - key: GROQ_API_KEY
        fromConfig: true
      - key: FIELD_ENCRYPTION_KEY
        fromConfig: true
      - key: ADMIN_PHONE
        fromConfig: true
      - key: ENABLE_WORKERS
        value: "true"
      - key: ENABLE_CRON
        value: "true"
      - key: BACKEND_URL
        fromConfig: true
      - key: SECRET_ROTATION_REMINDER
        fromConfig: true
      - key: LOG_REDACTION
        value: "true"
      - key: OTP_EXPIRY_MINUTES
        value: 5

  # Staging — validate changes before production (separate MongoDB + Redis recommended in Render config)
  - type: web
    name: siri-arts-backend-staging
    runtime: docker
    plan: standard
    autoDeploy: true
    healthCheckPath: /api/readiness
    maxShutdownDelaySeconds: 10
    envVars:
      - key: NODE_ENV
        value: staging
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PORT
        value: 10000
      - key: MONGO_URI
        fromConfig: true
      - key: MONGO_POOL_SIZE
        value: "10"
      - key: JWT_SECRET
        fromConfig: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: 30
      - key: REDIS_URL
        fromConfig: true
      - key: REQUIRE_REDIS
        value: "true"
      - key: LOG_LEVEL
        value: warn
      - key: ADMIN_ANALYTICS_CACHE_TTL
        value: "120"
      - key: FRONTEND_URLS
        fromConfig: true
      - key: CLOUDINARY_CLOUD_NAME
        fromConfig: true
      - key: CLOUDINARY_API_KEY
        fromConfig: true
      - key: CLOUDINARY_API_SECRET
        fromConfig: true
      - key: SENTRY_DSN
        fromConfig: true
      - key: GROQ_API_KEY
        fromConfig: true
      - key: FIELD_ENCRYPTION_KEY
        fromConfig: true
      - key: ADMIN_PHONE
        fromConfig: true
      - key: ENABLE_WORKERS
        value: "true"
      - key: ENABLE_CRON
        value: "true"
      - key: BACKEND_URL
        fromConfig: true
      - key: SECRET_ROTATION_REMINDER
        fromConfig: true
      - key: LOG_REDACTION
        value: "true"
      - key: OTP_EXPIRY_MINUTES
        value: 5
      - key: RAZORPAY_KEY_ID
        fromConfig: true
      - key: RAZORPAY_KEY_SECRET
        fromConfig: true
      - key: RAZORPAY_WEBHOOK_SECRET
        fromConfig: true
      - key: SMTP_USER
        fromConfig: true
      - key: SMTP_PASS
        fromConfig: true
      - key: BREVO_API_KEY
        fromConfig: true
      - key: SMTP_FROM_EMAIL
        fromConfig: true
      - key: ADMIN_EMAIL
        fromConfig: true
      - key: ADMIN_PASSWORD
        fromConfig: true
      - key: SUPER_ADMIN_EMAIL
        fromConfig: true
      - key: ADMIN_PHONE
        fromConfig: true
