# Render Blueprint — no seed/deploy hooks (never run seedData.ts in production)
services:
  - type: web
    name: siri-arts-backend
    runtime: docker
    # Production: upgrade to "standard" or higher — starter can OOM under Redis + Mongo pools
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        fromConfig: true
      - key: JWT_SECRET
        fromConfig: true
      # Intentionally short — forces refresh-token rotation; do not use 7d in production
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: 30
      - key: ADMIN_PASSWORD
        fromConfig: true
      - key: ADMIN_EMAIL
        fromConfig: true
      - key: OTP_EXPIRY_MINUTES
        value: 5
      - key: RAZORPAY_KEY_ID
        fromConfig: true
      - key: RAZORPAY_KEY_SECRET
        fromConfig: true
      - key: RAZORPAY_WEBHOOK_SECRET
        fromConfig: true
      - key: SUPER_ADMIN_EMAIL
        fromConfig: true
      - key: CLOUDINARY_CLOUD_NAME
        fromConfig: true
      - key: CLOUDINARY_API_KEY
        fromConfig: true
      - key: CLOUDINARY_API_SECRET
        fromConfig: true
      - key: FRONTEND_URLS
        fromConfig: true
      - key: SENTRY_DSN
        fromConfig: true
      - key: SMTP_USER
        fromConfig: true
      - key: SMTP_PASS
        fromConfig: true
      - key: BREVO_API_KEY
        fromConfig: true
      - key: REDIS_URL
        fromConfig: true
      - key: REQUIRE_REDIS
        value: "true"
      - key: SMTP_FROM_EMAIL
        fromConfig: true
      - key: SMTP_FROM_NAME
        value: "Siri Arts Studio"
