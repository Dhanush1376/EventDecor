<!doctype html>
<html lang="en" style="color-scheme: only light; background-color: #faf9f6;">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, interactive-widget=resizes-content" />
    
    <!-- Anti-Stale Service Worker Cleanup Script -->
    <script defer src="/sw-cleanup.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/MainLogo_bg.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/webp" href="/favicon-32x32.webp" />
    <link rel="apple-touch-icon" href="/MainLogo_bg.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#fbf9f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Siri Arts & Crafts" />
    <meta name="application-name" content="Siri Arts & Crafts" />
    <meta name="format-detection" content="telephone=no" />

    <!-- SEO:START
      Generic fallback head for routes without prerendered metadata. scripts/prerender-seo.mjs
      replaces this block per route at build time, and <SEO /> (react-helmet-async) replaces it
      at runtime; data-rh="true" lets Helmet take these tags over instead of duplicating them.
      Deliberately no canonical here: a shared canonical would point every URL at one page. -->
    <title>Siri Arts &amp; Crafts | Handcrafted Wedding &amp; Event Decor</title>
    <meta data-rh="true" name="description" content="Handcrafted wedding trays, pooja and festival decor, return gifts and event decoration from Siri Arts &amp; Crafts in Ongole, Andhra Pradesh." />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="Siri Arts &amp; Crafts" />
    <meta data-rh="true" property="og:title" content="Siri Arts &amp; Crafts | Handcrafted Wedding &amp; Event Decor" />
    <meta data-rh="true" property="og:image" content="https://siriartsandcrafts.com/og-image.webp" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <!-- SEO:END -->

    <!-- Performance: Preconnect & DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin fetchpriority="high" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    
    <!-- Header logo (192px WebP, ~13KB; used by the boot shell and the navbar) -->
    <link rel="preload" as="image" href="/MainLogo-192.webp" type="image/webp" />

    <!-- Font-loading classes + early LCP preload for hero-image routes (one small sync script) -->
    <script src="/boot.js"></script>

    <!-- Fonts are inserted by boot.js so they don't block first paint (display=swap). -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0..1,0&display=swap" />
    </noscript>

    <!-- Critical CSS: Prevent FOUC -->
    <style>
      /* Force light-only rendering on all browsers — prevents auto dark inversion */
      html {
        color-scheme: only light !important;
        background-color: #faf9f6 !important;
      }
      body {
        background-color: #faf9f6;
        color: #000000;
      }

      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', sans-serif;
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }



      /* Hide ugly ligature text (e.g. "storefront") completely until the font is loaded */
      html:not(.fonts-loaded) .material-symbols-outlined {
        color: transparent !important;
        user-select: none !important;
      }

      html.fonts-loading .material-symbols-outlined::after {
        content: "" !important;
        position: absolute !important;
        inset: 0 !important;
        transform: translateX(-100%) !important;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent) !important;
        animation: font-shimmer 1.5s infinite !important;
      }

      @keyframes font-shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      /* If the font fails to load, preserve invisible text/clean placeholders rather than leaking raw names */
      html.fonts-failed .material-symbols-outlined {
        color: transparent !important;
        background-color: rgba(115, 92, 0, 0.05) !important;
        border-radius: 6px !important;
        width: 1em !important;
        height: 1em !important;
        overflow: hidden !important;
        vertical-align: middle !important;
        user-select: none !important;
        text-shadow: none !important;
      }



      /* Prevent CLS: reserve space for common layout elements */
      #root {
        min-height: 100vh;
      }

      /*
       * Boot shell: a tiny CSS-only brand bar painted with the HTML, before any JS.
       * It sits OUTSIDE #root (so React never tries to hydrate it) and is removed
       * by App after React's first commit. Fixed-position, so removing it causes
       * no layout shift.
       */
      #boot-shell {
        position: fixed;
        inset: 0 0 auto 0;
        height: 64px;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf9f6;
        border-bottom: 1px solid rgba(115, 92, 0, 0.08);
        pointer-events: none;
      }
      #boot-shell img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
      }
      #boot-shell::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: -1px;
        height: 2px;
        width: 30%;
        background: #d4af37;
        animation: boot-bar 1.2s ease-in-out infinite;
      }
      @keyframes boot-bar {
        from { transform: translateX(-100%); }
        to { transform: translateX(340%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-shell::after { animation: none; width: 100%; opacity: 0.4; }
      }

    </style>

  </head>
  <body>
    <!-- Noscript fallback for accessibility -->
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript in your browser to use Siri Arts & Crafts.</p>
      </div>
    </noscript>

    <div id="boot-shell" aria-hidden="true"><img src="/MainLogo-192.webp" alt="" width="44" height="44" /></div>
    <!-- Keep #root empty: main.jsx hydrates when #root has children (prerendered HTML). -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx" fetchpriority="high"></script>

  </body>
</html>
