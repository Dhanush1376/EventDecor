<!doctype html>
<html lang="en" style="color-scheme: only light; background-color: #faf9f6;">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Anti-Stale Cache Headers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Anti-Stale Service Worker Cleanup Script -->
    <script defer src="/sw-cleanup.js"></script>

    <!-- Font Loading Fallback Handler -->
    <script>
      // Add a class while fonts are loading, and replace it when they succeed or fail
      if ("fonts" in document) {
        document.documentElement.classList.add('fonts-loading');
        Promise.all([
          document.fonts.load('24px "Material Symbols Outlined"'),
          document.fonts.load('16px "Inter"')
        ]).then(function() {
          document.documentElement.classList.remove('fonts-loading');
          document.documentElement.classList.add('fonts-loaded');
        }).catch(function() {
          document.documentElement.classList.remove('fonts-loading');
          document.documentElement.classList.add('fonts-failed');
        });
      } else {
        document.documentElement.classList.add('fonts-loaded');
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#fbf9f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Siri Arts" />
    <meta name="application-name" content="Siri Arts & Crafts" />
    <meta name="format-detection" content="telephone=no" />

    <!-- SEO -->
    <title>
      Siri Arts & Crafts | Wedding Decor, Handmade Gifts & Event Essentials
    </title>
    
    <meta
      name="description"
      content="Premium handcrafted wedding decor, pooja essentials, floral decorations, event decor, and customized gifts."
    />
    
    <meta
      name="keywords"
      content="event decor, wedding decor, handmade gifts, pooja essentials, floral decorations, handcrafted items"
    />
    
    <meta name="author" content="Siri Arts & Crafts" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://siriartsandcrafts.com/" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="GSC_ID" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Siri Arts & Crafts" />
    <meta
      property="og:description"
      content="Premium handcrafted event decor & gifts."
    />
    
    <meta
      property="og:image"
      content="https://siriartsandcrafts.com/logo.png"
    />
    
    <meta property="og:url" content="https://siriartsandcrafts.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Siri Arts & Crafts" />
    
    <meta
      name="twitter:description"
      content="Premium handcrafted event decor & gifts."
    />
    
    <meta
      name="twitter:image"
      content="https://siriartsandcrafts.com/logo.png"
    />

    <!-- Performance: Preconnect & DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://siri-arts-n-crafts.onrender.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin fetchpriority="high" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    
    <!-- Critical Assets Preload -->
    <link rel="preload" as="image" href="/logo-nobg-clean-sm.webp" type="image/webp" fetchpriority="high" />

    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" /></noscript>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0..1,0&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0..1,0&display=swap" /></noscript>

    <!-- Critical CSS: Prevent FOUC -->
    <style>
      /* Force light-only rendering on all browsers — prevents auto dark inversion */
      html {
        color-scheme: only light !important;
        background-color: #faf9f6 !important;
      }
      body {
        background-color: #faf9f6;
        color: #000000;
      }

      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', sans-serif;
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }

      .material-symbols-outlined:not(.absolute) {
        position: relative;
        top: 4px;
      }

      /* Hide ugly ligature text (e.g. "storefront") completely until the font is loaded */
      html:not(.fonts-loaded) .material-symbols-outlined {
        color: transparent !important;
        user-select: none !important;
      }

      html.fonts-loading .material-symbols-outlined::after {
        content: "" !important;
        position: absolute !important;
        inset: 0 !important;
        transform: translateX(-100%) !important;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent) !important;
        animation: font-shimmer 1.5s infinite !important;
      }

      @keyframes font-shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      /* If the font fails to load, preserve invisible text/clean placeholders rather than leaking raw names */
      html.fonts-failed .material-symbols-outlined {
        color: transparent !important;
        background-color: rgba(115, 92, 0, 0.05) !important;
        border-radius: 6px !important;
        width: 1em !important;
        height: 1em !important;
        overflow: hidden !important;
        vertical-align: middle !important;
        user-select: none !important;
        text-shadow: none !important;
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Prevent CLS: reserve space for common layout elements */
      #root {
        min-height: 100vh;
      }

    </style>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Siri Arts & Crafts",
      "url": "https://siriartsandcrafts.com",
      "logo": "https://siriartsandcrafts.com/logo.png"
    }
    </script>
  </head>
  <body>
    <!-- Noscript fallback for accessibility -->
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript in your browser to use Siri Arts & Crafts.</p>
      </div>
    </noscript>

    <div id="root">
      <!-- App Shell Skeleton: Displays instantly on cold start before React loads -->
      <style>
        .app-skeleton {
          display: flex;
          flex-direction: column;
          min-height: 100vh;
          background-color: #faf9f6;
          overflow: hidden;
        }
        .skel-header {
          height: 72px;
          border-bottom: 1px solid rgba(0, 0, 0, 0.05);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 5%;
          background: rgba(250, 250, 250, 0.85);
        }
        .skel-pulse {
          background: rgba(0, 0, 0, 0.06);
          animation: skel-pulse 1.5s infinite ease-in-out;
        }
        @keyframes skel-pulse {
          0% { opacity: 0.5; }
          50% { opacity: 1; }
          100% { opacity: 0.5; }
        }
        .skel-logo { width: 140px; height: 24px; border-radius: 6px; }
        .skel-nav { display: flex; gap: 24px; }
        .skel-nav-item { width: 64px; height: 16px; border-radius: 8px; }
        .skel-icons { display: flex; gap: 16px; }
        .skel-icon { width: 36px; height: 36px; border-radius: 50%; }
        
        .skel-hero {
          margin: 32px 5%;
          height: 60vh;
          border-radius: 32px;
        }
        
        @media (max-width: 768px) {
          .skel-nav { display: none; }
          .skel-header { padding: 0 24px; }
          .skel-hero { height: 50vh; border-radius: 24px; margin: 24px 24px; }
        }
      </style>
      <div id="app-shell" class="app-skeleton">
        <div class="skel-header">
          <div class="skel-pulse skel-logo"></div>
          <div class="skel-nav">
            <div class="skel-pulse skel-nav-item"></div>
            <div class="skel-pulse skel-nav-item"></div>
            <div class="skel-pulse skel-nav-item"></div>
            <div class="skel-pulse skel-nav-item"></div>
          </div>
          <div class="skel-icons">
            <div class="skel-pulse skel-icon"></div>
            <div class="skel-pulse skel-icon" style="display: none;"></div>
            <div class="skel-pulse skel-icon" style="display: none;"></div>
          </div>
        </div>
        <div class="skel-pulse skel-hero"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
