<!doctype html>
<html lang="en" style="color-scheme: only light; background-color: #faf9f6;">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Anti-Stale Cache Headers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Anti-Stale Service Worker Cleanup Script -->
    <script>
      if ('serviceWorker' in navigator) {
        // Forcefully unregister all service workers to kill the aggressive PWA cache
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#fbf9f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Siri Arts" />
    <meta name="application-name" content="Siri Arts & Crafts" />
    <meta name="format-detection" content="telephone=no" />

    <!-- SEO -->
    <title>
      Siri Arts & Crafts | Wedding Decor, Handmade Gifts & Event Essentials
    </title>
    
    <meta
      name="description"
      content="Premium handcrafted wedding decor, pooja essentials, floral decorations, event decor, and customized gifts."
    />
    
    <meta
      name="keywords"
      content="event decor, wedding decor, handmade gifts, pooja essentials, floral decorations, handcrafted items"
    />
    
    <meta name="author" content="Siri Arts & Crafts" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://siriartsandcrafts.com/" />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="GSC_ID" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Siri Arts & Crafts" />
    <meta
      property="og:description"
      content="Premium handcrafted event decor & gifts."
    />
    
    <meta
      property="og:image"
      content="https://siriartsandcrafts.com/logo.png"
    />
    
    <meta property="og:url" content="https://siriartsandcrafts.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Siri Arts & Crafts" />
    
    <meta
      name="twitter:description"
      content="Premium handcrafted event decor & gifts."
    />
    
    <meta
      name="twitter:image"
      content="https://siriartsandcrafts.com/logo.png"
    />

    <!-- Performance: Preconnect & DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- Fonts — non-blocking load; display=swap reduces CLS -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" /></noscript>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" /></noscript>

    <!-- Critical CSS: Prevent FOUC -->
    <style>
      /* Force light-only rendering on all browsers — prevents auto dark inversion */
      html {
        color-scheme: only light !important;
        background-color: #faf9f6 !important;
      }
      body {
        background-color: #faf9f6;
        color: #000000;
      }

      /* Prevent FOUC for Material icons */
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }


      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Prevent CLS: reserve space for common layout elements */
      #root {
        min-height: 100vh;
      }

      /* Instant shell before React hydrates — avoids blank screen on cold start */
      .app-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #faf9f6;
        color: #1a1a1a;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      .app-shell__mark {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 9999px;
        border: 1px solid rgba(212, 175, 55, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.5rem;
        color: #b8860b;
        animation: shell-pulse 1.4s ease-in-out infinite;
      }
      .app-shell__label {
        font-size: 0.625rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: rgba(26, 26, 26, 0.55);
      }
      @keyframes shell-pulse {
        0%, 100% { opacity: 0.65; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Siri Arts & Crafts",
      "url": "https://siriartsandcrafts.com",
      "logo": "https://siriartsandcrafts.com/logo.png"
    }
    </script>
  </head>
  <body>
    <!-- Noscript fallback for accessibility -->
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript in your browser to use Siri Arts & Crafts.</p>
      </div>
    </noscript>

    <div id="root">
      <div class="app-shell" id="app-shell" aria-hidden="true">
        <div class="app-shell__mark">S</div>
        <span class="app-shell__label">Loading studio</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
