<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="16x16" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="mask-icon" href="/favicon.png" color="#d4af37" />
    <meta name="msapplication-TileImage" content="/favicon.png" />
    <meta name="msapplication-TileColor" content="#d4af37" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="theme-color" content="#fbf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Siri Arts" />
    <meta name="application-name" content="Siri Arts & Crafts" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Primary SEO Meta (overridden by react-helmet-async per page) -->
    <title>Siri Arts & Crafts | Premium Handcrafted Event Decor & Gifts</title>
    <meta name="description" content="Discover exquisite, handcrafted event decor, wedding trays, and pooja essentials. Woven with tradition and refined for the modern aesthetic. Worldwide shipping." />
    <meta name="keywords" content="handcrafted decor, event decor, wedding decor, Indian wedding, artisanal crafts, pooja essentials, Siri Arts" />
    <link rel="canonical" href="https://siriartsandcrafts.com" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Siri Arts & Crafts" />
    <meta name="geo.region" content="IN-TS" />
    <meta name="geo.placename" content="Hyderabad" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Siri Arts & Crafts" />
    <meta property="og:title" content="Siri Arts & Crafts | Handcrafted Elegance" />
    <meta property="og:description" content="Premium handcrafted decor for your most precious moments." />
    <meta property="og:image" content="https://siriartsandcrafts.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://siriartsandcrafts.com" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@siriarts" />
    <meta name="twitter:title" content="Siri Arts & Crafts | Handcrafted Elegance" />
    <meta name="twitter:description" content="Premium handcrafted decor for your most precious moments." />
    <meta name="twitter:image" content="https://siriartsandcrafts.com/og-image.jpg" />

    <!-- Performance: Preconnect & DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- Fonts — display=swap for CLS optimization -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

    <!-- Critical CSS: Prevent FOUC -->
    <style>
      /* Prevent FOUC for Material icons */
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }

      /* Skip-to-content link accessibility */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #d4af37;
        color: #fff;
        padding: 8px 16px;
        z-index: 100000;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 0 0 4px 0;
        transition: top 0.2s;
      }
      .skip-link:focus {
        top: 0;
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Prevent CLS: reserve space for common layout elements */
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <!-- Noscript fallback for accessibility -->
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript in your browser to use Siri Arts & Crafts.</p>
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
