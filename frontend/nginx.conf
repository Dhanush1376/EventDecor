server {
    listen 8080;
    server_name localhost;

    # Suppress nginx version in response headers to prevent version fingerprinting
    server_tokens off;

    # Limit request body size to prevent oversized uploads at the edge
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    # Dynamic single-page application (SPA) router fallback
    location / {
        set $is_bot 0;
        
        # Detect Social Crawlers
        if ($http_user_agent ~* "facebookexternalhit|twitterbot|linkedinbot|whatsapp|slackbot|telegrambot|discordbot|pinterest|skypeuripreview|vkshare|googlebot|bingbot|yandexbot|duckduckbot") {
            set $is_bot 1;
        }

        # Route specific paths for social sharing metadata (Proxy to backend)
        # Note: Disabled because backend does not currently implement /api/v1/social/product

        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the live backend server
    location /api/ {
        proxy_pass https://eventdecor-lztd.onrender.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host eventdecor-lztd.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enable deep high-compression Gzip rules
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_static on;
    gzip_types 
        text/plain 
        text/css 
        application/json 
        application/javascript 
        text/xml 
        application/xml 
        application/xml+rss 
        text/javascript 
        image/svg+xml 
        image/x-icon;

    # Secure HTTP response headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), usb=(), payment=(self \"https://checkout.razorpay.com\")" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://cdn.razorpay.com https://unpkg.com https://static.cloudflareinsights.com https://cdn.logr-in.com https://*.logrocket.io https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://res.cloudinary.com https://flagcdn.com https://images.unsplash.com https://lh3.googleusercontent.com https://eventdecor-lztd.onrender.com https://*.pinimg.com https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.cloudinary.com https://eventdecor-lztd.onrender.com wss://eventdecor-lztd.onrender.com https://siriartsandcrafts.com wss://siriartsandcrafts.com https://api.razorpay.com https://lumberjack.razorpay.com https://*.sentry.io https://*.logrocket.io https://*.cloudflareinsights.com https://accounts.google.com; worker-src 'self' blob:; frame-src 'self' https://checkout.razorpay.com https://api.razorpay.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    # 1-year immutable caching for hashed asset files
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), usb=(), payment=(self \"https://checkout.razorpay.com\")" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://cdn.razorpay.com https://unpkg.com https://static.cloudflareinsights.com https://cdn.logr-in.com https://*.logrocket.io https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://res.cloudinary.com https://flagcdn.com https://images.unsplash.com https://lh3.googleusercontent.com https://eventdecor-lztd.onrender.com https://*.pinimg.com https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.cloudinary.com https://eventdecor-lztd.onrender.com wss://eventdecor-lztd.onrender.com https://siriartsandcrafts.com wss://siriartsandcrafts.com https://api.razorpay.com https://lumberjack.razorpay.com https://*.sentry.io https://*.logrocket.io https://*.cloudflareinsights.com https://accounts.google.com; worker-src 'self' blob:; frame-src 'self' https://checkout.razorpay.com https://api.razorpay.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
        access_log off;
    }

    # Service worker must always revalidate so new deployments activate promptly
    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        access_log off;
    }

    # Prevent caching for the entrypoint document to ensure instant hot-reloads on deployments
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), usb=(), payment=(self \"https://checkout.razorpay.com\")" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://cdn.razorpay.com https://unpkg.com https://static.cloudflareinsights.com https://cdn.logr-in.com https://*.logrocket.io https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://res.cloudinary.com https://flagcdn.com https://images.unsplash.com https://lh3.googleusercontent.com https://eventdecor-lztd.onrender.com https://*.pinimg.com https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.cloudinary.com https://eventdecor-lztd.onrender.com wss://eventdecor-lztd.onrender.com https://siriartsandcrafts.com wss://siriartsandcrafts.com https://api.razorpay.com https://lumberjack.razorpay.com https://*.sentry.io https://*.logrocket.io https://*.cloudflareinsights.com https://accounts.google.com; worker-src 'self' blob:; frame-src 'self' https://checkout.razorpay.com https://api.razorpay.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    }

    # Global health check for load balancer targets
    location /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # Error pages redirects
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
