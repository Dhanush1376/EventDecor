name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Backend CI placeholders (validated by check-env, not used for real connections)
  PORT: "5000"
  NODE_ENV: development
  MONGO_URI: mongodb://127.0.0.1:27017/eventdecor_ci
  JWT_SECRET: ci_jwt_secret_must_be_at_least_32_chars_long
  JWT_EXPIRES_IN: 7d
  ADMIN_EMAIL: admin@ci.example.com
  ADMIN_PASSWORD: ci_admin_password_placeholder_strong
  BREVO_API_KEY: ci_brevo_placeholder_key
  SMTP_FROM_EMAIL: no-reply@ci.example.com
  FIELD_ENCRYPTION_KEY: ci_field_encryption_key_must_be_at_least_32_chars_long
  BACKEND_URL: http://localhost:5000
  GROQ_API_KEY: ci_groq_placeholder_key
  # Services and Webhooks placeholders
  REDIS_URL: redis://127.0.0.1:6379
  SENTRY_DSN: https://ci_placeholder@sentry.io/12345
  ALERT_WEBHOOK_URL: https://discord.com/api/webhooks/ci_placeholder
  # GitHub Backup placeholders
  GITHUB_BACKUP_TOKEN: ci_github_token_placeholder
  GITHUB_BACKUP_OWNER: ci_placeholder_owner
  GITHUB_BACKUP_REPO: ci_placeholder_repo
  # Payment placeholders (required by envSchema.ts)
  RAZORPAY_KEY_ID: rzp_test_ci_placeholder_key
  RAZORPAY_KEY_SECRET: ci_razorpay_secret_placeholder
  RAZORPAY_WEBHOOK_SECRET: ci_webhook_secret_placeholder_must_be_long_enough_32
  # Media placeholders (required by envSchema.ts)
  CLOUDINARY_CLOUD_NAME: ci_cloud_name
  CLOUDINARY_API_KEY: ci_cloudinary_api_key
  CLOUDINARY_API_SECRET: ci_cloudinary_api_secret
  # URLs
  FRONTEND_URLS: http://localhost:5173
  # Frontend build-time variables
  VITE_API_URL: https://api.ci.example.com/api
  VITE_SITE_URL: https://siriartsandcrafts.com
  VITE_RAZORPAY_KEY_ID: rzptest_ci_placeholder
  VITE_SITE_NAME: Siri Arts & Crafts
  VITE_CONTACT_PHONE: "+91-9866006648"
  VITE_MARBLE_TEXTURE_URL: https://dummyimage.com/1920x1080/ccc/000.webp&text=ci_placeholder_texture

jobs:
  build:
    runs-on: ubuntu-latest

    services: {}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Start MongoDB Replica Set (Required for Transactions)
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      # Pin TruffleHog to a specific release tag for reproducible builds
      - name: TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@v3.95.6
        with:
          path: ./
          extra_args: --debug --only-verified

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      # Fail the build on critical/high severity vulnerabilities in production deps
      - name: Audit Backend Dependencies
        working-directory: backend
        run: npm audit --audit-level=critical --omit=dev

      - name: Validate Backend Environment
        working-directory: backend
        run: npm run check-env

      - name: Lint Backend
        working-directory: backend
        run: npm run lint

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Verify index script (dry run against CI Mongo)
        working-directory: backend
        run: npm run create-indexes
        env:
          SKIP_INDEX_BUILD: "false"

      - name: Test Backend
        working-directory: backend
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # Fail the build on critical/high severity vulnerabilities in production deps
      - name: Audit Frontend Dependencies
        working-directory: frontend
        run: npm audit --audit-level=critical --omit=dev

      - name: Validate Frontend Environment
        working-directory: frontend
        run: npm run check-env

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Test Frontend
        working-directory: frontend
        run: npm test

      - name: Build Frontend
        working-directory: frontend
        run: npm run build:report

  deploy:
    name: Deploy to Railway
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Railway Deploy Webhook
        id: deploy
        run: |
          if [ -z "${{ secrets.RAILWAY_WEBHOOK_URL }}" ]; then
            echo "RAILWAY_WEBHOOK_URL secret is not set, skipping automatic deployment."
            exit 0
          fi
          curl -s -X POST "${{ secrets.RAILWAY_WEBHOOK_URL }}"

      - name: Wait for Zero-Downtime Deployment
        run: sleep 60
      - name: Automated Rollback on Failure
        run: echo "Rollback logic here if needed"
      - name: Post-Deploy Smoke Tests
        run: curl -sSf https://eventdecor-production-1647.up.railway.app/api/readiness || exit 1
