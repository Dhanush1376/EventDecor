name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Backend CI placeholders (validated by check-env, not used for real connections)
  PORT: "5000"
  NODE_ENV: development
  MONGO_URI: mongodb://127.0.0.1:27017/eventdecor_ci
  JWT_SECRET: ci_jwt_secret_must_be_at_least_32_chars_long
  JWT_EXPIRES_IN: 7d
  ADMIN_EMAIL: admin@ci.example.com
  ADMIN_PASSWORD: ci_admin_password_placeholder_strong
  BREVO_API_KEY: ci_brevo_placeholder_key
  SMTP_FROM_EMAIL: no-reply@ci.example.com
  FIELD_ENCRYPTION_KEY: ci_field_encryption_key_must_be_at_least_32_chars_long
  BACKEND_URL: http://localhost:5000
  GROQ_API_KEY: ci_groq_placeholder_key
  # Payment placeholders (required by envSchema.ts)
  RAZORPAY_KEY_ID: rzp_test_ci_placeholder_key
  RAZORPAY_KEY_SECRET: ci_razorpay_secret_placeholder
  RAZORPAY_WEBHOOK_SECRET: ci_webhook_secret_placeholder_must_be_long_enough_32
  # Media placeholders (required by envSchema.ts)
  CLOUDINARY_CLOUD_NAME: ci_cloud_name
  CLOUDINARY_API_KEY: ci_cloudinary_api_key
  CLOUDINARY_API_SECRET: ci_cloudinary_api_secret
  # URLs
  FRONTEND_URLS: http://localhost:5173
  # Frontend build-time variables
  VITE_API_URL: https://api.ci.example.com/api
  VITE_SITE_URL: https://siriartsandcrafts.com
  VITE_RAZORPAY_KEY_ID: rzptest_ci_placeholder
  VITE_SITE_NAME: Siri Arts & Crafts
  VITE_CONTACT_PHONE: "+91-9866006648"
  VITE_MARBLE_TEXTURE_URL: https://dummyimage.com/1920x1080/ccc/000.webp&text=ci_placeholder_texture

jobs:
  build:
    runs-on: ubuntu-latest

    services: {}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Start MongoDB Replica Set (Required for Transactions)
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      # Pin TruffleHog to a specific release tag for reproducible builds
      - name: TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: ./
          extra_args: --debug --only-verified

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      # Fail the build on critical/high severity vulnerabilities in production deps
      - name: Audit Backend Dependencies
        working-directory: backend
        run: npm audit --audit-level=critical --omit=dev

      - name: Validate Backend Environment
        working-directory: backend
        run: npm run check-env

      - name: Check no stray console.* in src
        run: node scripts/check-no-console.mjs

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Verify index script (dry run against CI Mongo)
        working-directory: backend
        run: npm run create-indexes
        env:
          SKIP_INDEX_BUILD: "false"

      - name: Test Backend
        working-directory: backend
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # Fail the build on critical/high severity vulnerabilities in production deps
      - name: Audit Frontend Dependencies
        working-directory: frontend
        run: npm audit --audit-level=critical --omit=dev

      - name: Validate Frontend Environment
        working-directory: frontend
        run: npm run check-env

      - name: Test Frontend
        working-directory: frontend
        run: npm test

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Render
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy Hook
        id: deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set, skipping automatic deployment."
            exit 0
          fi
          # We trigger the deploy and capture the output if possible, but standard webhooks just return a 200.
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for Zero-Downtime Deployment
        if: env.VITE_API_URL != ''
        run: |
          echo "Waiting 60s for the deployment to start swapping..."
          sleep 60
          
          echo "Polling health endpoint for stability..."
          for i in {1..30}; do
            # Using the production endpoint for validation
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.siriartsandcrafts.com/api/v1/health?full=1 || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Deployment is healthy and stable (HTTP 200)."
              exit 0
            fi
            echo "Health check failed (HTTP $HTTP_STATUS). Retrying in 10 seconds..."
            sleep 10
          done
          
          echo "Deployment failed to stabilize after 5 minutes."
          exit 1

      - name: Automated Rollback on Failure
        if: failure()
        run: |
          echo "Health check failed! Triggering automated rollback..."
          if [ -n "${{ secrets.RENDER_ROLLBACK_HOOK_URL }}" ]; then
             curl -s -X POST "${{ secrets.RENDER_ROLLBACK_HOOK_URL }}"
             echo "Rollback webhook triggered."
          elif [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
             echo "Executing explicit Render API rollback (Requires Service ID)"
             # curl -X POST https://api.render.com/v1/services/srv-XXXX/deploys ...
          else
             echo "No rollback webhook or API key provided. Manual rollback required."
          fi
          exit 1
