name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Backend CI placeholders (validated by check-env, not used for real connections)
  PORT: "5000"
  NODE_ENV: development
  MONGO_URI: mongodb://127.0.0.1:27017/eventdecor_ci
  JWT_SECRET: ci_jwt_secret_must_be_at_least_32_chars_long
  JWT_EXPIRES_IN: 7d
  ADMIN_EMAIL: admin@ci.example.com
  BREVO_API_KEY: ci_brevo_placeholder_key
  SMTP_FROM_EMAIL: no-reply@ci.example.com
  # Frontend build-time variables
  VITE_API_URL: https://api.ci.example.com/api
  VITE_SITE_URL: https://siriartsandcrafts.com
  VITE_RAZORPAY_KEY_ID: rzptest_ci_placeholder
  VITE_SITE_NAME: Siri Arts & Crafts
  VITE_CONTACT_PHONE: "+91-9866006648"
  VITE_MARBLE_TEXTURE_URL: https://res.cloudinary.com/drxgnnzeb/image/upload/q_auto,f_webp,w_1920/v1/event_decor_ecommerce/assets/event_decor_marble-texture

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Backend Environment
        working-directory: backend
        run: npm run check-env

      - name: Check no stray console.* in src
        run: node scripts/check-no-console.mjs

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Verify index script (dry run against CI Mongo)
        working-directory: backend
        run: npm run create-indexes
        env:
          SKIP_INDEX_BUILD: "false"

      - name: Test Backend
        working-directory: backend
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate Frontend Environment
        working-directory: frontend
        run: npm run check-env

      - name: Test Frontend
        working-directory: frontend
        run: npm test

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
