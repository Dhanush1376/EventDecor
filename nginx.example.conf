# Example nginx config for self-hosted frontend static files.
# Aligns with security headers and caching in frontend/vercel.json
#
# TLS: terminate at a load balancer OR add ssl_certificate paths below.
# All HTTP traffic must redirect to HTTPS in production.

limit_req_zone $binary_remote_addr zone=static_general:10m rate=20r/s;

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name localhost;

    # ═══ TLS Configuration ═══
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Enforce modern TLS only — disable TLS 1.0/1.1 (vulnerable to BEAST, POODLE)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Modern cipher suite — prioritize AEAD ciphers (GCM, ChaCha20)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    # TLS session cache — reduces handshake overhead for returning connections
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling — improves TLS handshake speed and validates certificate revocation
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Security headers (match vercel.json posture)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://static.cloudflareinsights.com https://cdn.logr-in.com https://*.logrocket.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://res.cloudinary.com https://flagcdn.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://eventdecor-production-1647.up.railway.app wss://eventdecor-production-1647.up.railway.app https://api.razorpay.com https://*.cloudflareinsights.com; frame-src 'self' https://checkout.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # ═══ Proxy pass to backend API (if co-hosting) ═══
    # location /api/ {
    #     proxy_pass http://backend:10000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        limit_req zone=static_general burst=40 nodelay;

        set $is_bot 0;
        
        # Detect Social Crawlers
        if ($http_user_agent ~* "facebookexternalhit|twitterbot|linkedinbot|whatsapp|slackbot|telegrambot|discordbot|pinterest|skypeuripreview|vkshare|googlebot|bingbot|yandexbot|duckduckbot") {
            set $is_bot 1;
        }

        # Route specific paths for social sharing metadata (Proxy to backend)
        if ($uri ~ "^/product/(.*)$") {
            set $proxy_bot $is_bot;
        }
        
        if ($proxy_bot = 1) {
            rewrite ^/product/(.*)$ /api/v1/social/product/$1 break;
            proxy_pass http://backend:10000;
        }

        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
